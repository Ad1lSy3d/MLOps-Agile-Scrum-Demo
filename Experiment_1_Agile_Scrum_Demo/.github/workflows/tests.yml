name: CI / Automated Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests and Pipeline Verification (Experiment 1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Experiment_1_Agile_Scrum_Demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Execute Iris pipeline
        run: uv run python src/iris_demo.py

      - name: Run automated unit tests
        run: uv run python -m unittest discover -s tests -v
